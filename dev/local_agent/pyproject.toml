[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vivado-rtl-agent"
version = "0.1.0"
description = "A small, auditable RTL repair agent using Vivado Tcl"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["rtl_agent*"]

[tool.setuptools.data-files]
"." = ["config.example.json"]
"examples" = ["examples/counter.md", "examples/counter_tb.sv"]
